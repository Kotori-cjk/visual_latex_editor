[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-latex-editor"
version = "0.2.0"
description = "A local, source-backed visual LaTeX editor with clickable PDF previews"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Kotori-cjk"}]
dependencies = ["Pillow>=10.1", "pypdf>=5"]
keywords = ["latex", "editor", "pdf", "synctex", "visual-editor"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup :: LaTeX",
  "Operating System :: OS Independent",
]

[project.scripts]
visual-latex-editor = "visual_latex_editor.server:main"

[project.urls]
Repository = "https://github.com/Kotori-cjk/visual_latex_editor"
Issues = "https://github.com/Kotori-cjk/visual_latex_editor/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
visual_latex_editor = ["static/*", "example/*.tex", "example/assets/*.png"]
